name: stock-bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      listar:
        description: "Enviar por Telegram la lista de productos con stock"
        type: boolean
        default: false
      diagnostico:
        description: "Solo diagnóstico: detectar la plataforma de cada tienda (no envía avisos)"
        type: boolean
        default: false
      probar_telegram:
        description: "Solo probar Telegram: envía un mensaje de prueba a cada chat"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: stock-bot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LISTAR: ${{ inputs.listar }}
          DIAG: ${{ inputs.diagnostico }}
          TEST_TG: ${{ inputs.probar_telegram }}
        run: python stock_bot.py
      - name: Guardar estado
        if: always()
        run: |
          [ -f state.json ] || exit 0
          cp state.json /tmp/state.json
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state.json state.json
            git add state.json
            git diff --cached --quiet && exit 0
            git commit -m "update state"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
